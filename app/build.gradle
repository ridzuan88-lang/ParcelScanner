plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chewanninja.parcelscanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.chewanninja.parcelscanner"
        minSdk 24            // Android 7.0 Nougat (Kaicom K7)
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
