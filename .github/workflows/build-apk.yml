name: Build APK

on:
  workflow_dispatch:        # GitHub -> Actions -> Build APK -> Run workflow
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK (ANDROID_HOME). Gradle downloads
      # any missing platform itself, so no separate SDK setup action is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Make sure the Gradle wrapper exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing - regenerating wrapper"
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ParcelScanner-KaicomK7.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParcelScanner-KaicomK7
          path: dist/ParcelScanner-KaicomK7.apk
          if-no-files-found: error
